<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to SVG to STL Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Image to SVG to STL Converter</h1>

        <!-- Step 1: Image Upload and Editing -->
        <section class="step">
            <h2>Step 1: Upload & Edit Image</h2>
            <div class="controls">
                <input type="file" id="imageInput" accept="image/*">
                <div class="slider-group">
                    <label>
                        Brightness: <span id="brightnessValue">0</span>
                        <input type="range" id="brightness" min="-100" max="100" value="0" step="1">
                    </label>
                    <label>
                        Contrast: <span id="contrastValue">0</span>
                        <input type="range" id="contrast" min="-100" max="100" value="0" step="1">
                    </label>
                </div>
            </div>
            <div class="preview">
                <canvas id="imageCanvas"></canvas>
            </div>
        </section>

        <!-- Step 2: SVG Conversion with Stroke Controls -->
        <section class="step">
            <h2>Step 2: Convert to SVG & Adjust Strokes</h2>
            <div class="controls">
                <button id="convertToSVG">Convert to SVG</button>
                <div class="slider-group">
                    <label>
                        Threshold: <span id="thresholdValue">128</span>
                        <input type="range" id="threshold" min="0" max="255" value="128" step="1">
                    </label>
                    <label>
                        Black Stroke Width: <span id="blackStrokeValue">1</span>
                        <input type="range" id="blackStroke" min="0" max="10" value="1" step="0.1">
                    </label>
                    <label>
                        White Stroke Width: <span id="whiteStrokeValue">1</span>
                        <input type="range" id="whiteStroke" min="0" max="10" value="1" step="0.1">
                    </label>
                </div>
            </div>
            <div class="preview">
                <div id="svgPreview"></div>
            </div>
        </section>

        <!-- Step 3: Re-conversion Pipeline -->
        <section class="step">
            <h2>Step 3: SVG → Image → SVG Re-conversion</h2>
            <div class="controls">
                <button id="reconvertSVG">Re-convert SVG</button>
                <div class="slider-group">
                    <label>
                        Re-conversion Threshold: <span id="reconvertThresholdValue">128</span>
                        <input type="range" id="reconvertThreshold" min="0" max="255" value="128" step="1">
                    </label>
                </div>
            </div>
            <div class="preview">
                <div id="reconvertedSVGPreview"></div>
            </div>
        </section>

        <!-- Step 4: 3D STL Conversion -->
        <section class="step">
            <h2>Step 4: Convert to 3D STL Mesh</h2>
            <div class="controls">
                <button id="convertToSTL">Generate 3D Model</button>
                <div class="slider-group">
                    <label>
                        Extrusion Depth: <span id="depthValue">5</span>
                        <input type="range" id="depth" min="0.1" max="20" value="5" step="0.1">
                    </label>
                    <label>
                        Bevel Size: <span id="bevelValue">0</span>
                        <input type="range" id="bevel" min="0" max="5" value="0" step="0.1">
                    </label>
                </div>
                <button id="downloadSTL">Download STL</button>
            </div>
            <div class="preview preview-3d">
                <div id="stlPreview"></div>
            </div>
        </section>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/potrace@2.1.8/dist/potrace.min.js"></script>

    <!-- Main Application Script -->
    <script src="app.js"></script>
</body>
</html>
