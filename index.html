<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to SVG to STL Converter</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Tab styling */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-button {
            padding: 12px 24px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s;
        }

        .tab-button:hover {
            background: #e0e0e0;
        }

        .tab-button.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .before-after-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .before-after-item {
            text-align: center;
        }

        .before-after-item h3 {
            margin-bottom: 10px;
            font-size: 18px;
            color: #333;
        }

        .preview-box {
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-box canvas,
        .preview-box > div {
            max-width: 100%;
        }

        .controls-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .stl-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stl-slider-section {
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .stl-download-section {
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
            margin-top: 30px;
        }

        #stlPreview {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image to SVG to STL Converter</h1>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-button active" data-tab="image-tab">Image Edits</button>
            <button class="tab-button" data-tab="svg-tab">SVG Edits</button>
            <button class="tab-button" data-tab="3d-tab">3D View</button>
        </div>

        <!-- Tab 1: Image Edits -->
        <div id="image-tab" class="tab-content active">
            <div class="before-after-container">
                <div class="before-after-item">
                    <h3>Original Image</h3>
                    <div class="preview-box">
                        <canvas id="originalCanvas"></canvas>
                    </div>
                </div>
                <div class="before-after-item">
                    <h3>Edited Image</h3>
                    <div class="preview-box">
                        <canvas id="imageCanvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="controls-section">
                <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 15px;">

                <div class="slider-group">
                    <label>
                        Brightness: <span id="brightnessValue">0</span>
                        <input type="range" id="brightness" min="-100" max="100" value="0" step="1">
                    </label>
                    <label>
                        Contrast: <span id="contrastValue">0</span>
                        <input type="range" id="contrast" min="-100" max="100" value="0" step="1">
                    </label>
                </div>

                <div class="action-buttons">
                    <button id="greyscaleBtn">Convert to Greyscale</button>
                    <button id="invertBtn">Invert Colors</button>
                </div>
            </div>

            <div class="action-buttons" style="margin-top: 20px;">
                <button id="convertToSVG" style="padding: 12px 30px; font-size: 16px; font-weight: bold;">Convert to SVG →</button>
            </div>
        </div>

        <!-- Tab 2: SVG Edits -->
        <div id="svg-tab" class="tab-content">
            <div class="before-after-container">
                <div class="before-after-item">
                    <h3>Initial SVG</h3>
                    <div class="preview-box">
                        <div id="svgPreviewBefore"></div>
                    </div>
                </div>
                <div class="before-after-item">
                    <h3>Edited SVG</h3>
                    <div class="preview-box">
                        <div id="svgPreview"></div>
                    </div>
                </div>
            </div>

            <div class="controls-section">
                <div class="slider-group">
                    <label>
                        Threshold: <span id="thresholdValue">128</span>
                        <input type="range" id="threshold" min="0" max="255" value="128" step="1">
                    </label>
                    <label>
                        Stroke Width (- erode / + dilate): <span id="strokeWidthValue">0</span>
                        <input type="range" id="strokeWidth" min="-10" max="10" value="0" step="0.1">
                    </label>
                </div>

                <div class="action-buttons">
                    <button id="reconvertSVG">Re-convert SVG</button>
                </div>
            </div>

            <div class="action-buttons" style="margin-top: 20px;">
                <button id="convertToSTL" style="padding: 12px 30px; font-size: 16px; font-weight: bold;">Generate 3D Model →</button>
            </div>
        </div>

        <!-- Tab 3: 3D View -->
        <div id="3d-tab" class="tab-content">
            <div id="stlPreview"></div>

            <div class="stl-controls">
                <div class="stl-slider-section">
                    <label>
                        Extrusion Depth: <span id="depthValue">5</span> mm
                        <input type="range" id="depth" min="0.1" max="20" value="5" step="0.1">
                    </label>
                </div>

                <div class="stl-download-section">
                    <button id="downloadSTL" style="padding: 12px 30px; font-size: 16px; font-weight: bold;">Download STL</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>

    <!-- Main Application Script -->
    <script src="app.js"></script>
</body>
</html>
